name: build.yml
on:
  push:
    tags: [ v* ]

jobs:
  test_everything:
    uses: ./.github/workflows/test.yml

  build:
    needs: [ test_everything ]

    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.x'
          cache: 'npm'

      - name: Set authoritative version
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --ignore-scripts

      - name: Setup dependencies
        run: npm install

      - name: Build and publish artifacts
        run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}